[project]
name = "expense-tracker"
version = "0.1.0"
description = "A small command-line expense tracker (teaching starter project)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
expense-tracker = "expense_tracker.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
